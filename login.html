<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 | TOBIC 국제 실용 구기 능력 시험</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f7fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #0d47a1;
            text-decoration: none;
        }

        .logo span {
            display: block;
            font-size: 13px;
            font-weight: normal;
            color: #666;
            margin-top: -4px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .login-box h1 {
            text-align: center;
            color: #0d47a1;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 0 13px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1976d2;
        }

        button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 7px;
            background: #1557b0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #0d47a1;
        }

        button:disabled {
            background: #8ba8cf;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #c62828;
            border: 1px solid #ffcaca;
        }

        .message.success {
            display: block;
            background: #eef9f0;
            color: #1b7a32;
            border: 1px solid #bfe5c7;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #0d47a1;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            text-align: center;
            margin-top: 12px;
        }

        .home-link a {
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }

        .home-link a:hover {
            color: #0d47a1;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            padding: 25px 20px;
            line-height: 1.6;
        }

        footer a {
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 30px 22px;
            }

            .header-inner {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">
            TOBIC
            <span>국제 실용 구기 능력 시험</span>
        </a>
    </div>
</header>

<main>

    <div class="login-box">

        <h1>TOBIC 로그인</h1>

        <p class="description">
            TOBIC 국제 실용 구기 능력 시험<br>
            회원 로그인
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">이메일</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>

                <input
                    type="password"
                    id="password"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                로그인
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="signup-link">
            아직 회원이 아니신가요?
            <a href="signup.html">회원가입</a>
        </div>

        <div class="home-link">
            <a href="index.html">← TOBIC 홈페이지로 돌아가기</a>
        </div>

    </div>

</main>

<footer>

    <p>
        TOBIC 국제 실용 구기 능력 시험
    </p>

    <p>
        Test Of Ball sports for International Certification
    </p>

    <p>
        시험 주관사 : 세계킥테니스연맹
        ·
        <a href="https://www.wkf.kr" target="_blank" rel="noopener noreferrer">
            www.wkf.kr
        </a>
    </p>

    <p>
        © TOBIC. All Rights Reserved.
    </p>

</footer>


<!-- Supabase JavaScript Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /*
    ==========================================================
    TOBIC Supabase 설정
    ==========================================================
    */

    const SUPABASE_URL =
        "https://zbnpdxxtkbkogjlswzpr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_E2Urt7TjWt9b4M0MW1CYeQ_sFa45BDG";


    /*
    ==========================================================
    Supabase 연결
    ==========================================================
    */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /*
    ==========================================================
    화면 요소
    ==========================================================
    */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    /*
    ==========================================================
    메시지 표시
    ==========================================================
    */

    function showMessage(text, type) {

        message.textContent = text;
        message.className = "message " + type;

    }


    /*
    ==========================================================
    로그인
    ==========================================================
    */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            if (!email || !password) {

                showMessage(
                    "이메일과 비밀번호를 모두 입력해 주세요.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;
            loginButton.textContent = "로그인 중...";

            message.className = "message";
            message.textContent = "";


            try {

         const { data, error } =
    await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });


                if (error) {

                    console.error(error);

                    let errorMessage =
                        "로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.";


                    if (
                        error.message &&
                        error.message
                            .toLowerCase()
                            .includes("email not confirmed")
                    ) {

                        errorMessage =
                            "이메일 인증이 완료되지 않았습니다. 인증메일을 확인해 주세요.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );

                    return;
                }


                if (data && data.user) {

                    showMessage(
                        "로그인되었습니다. TOBIC 홈페이지로 이동합니다.",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    "로그인 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.",
                    "error"
                );

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "로그인";

            }

        }
    );

</script>

</body>
</html>
